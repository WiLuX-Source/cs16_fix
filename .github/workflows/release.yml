name: Build and release installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" CS16ZBots.iss'

      - name: Read versions
        id: version
        shell: pwsh
        run: |
          $app = (Select-String -Path CS16ZBots.iss -Pattern '^#define AppVersion "(.+)"').Matches[0].Groups[1].Value
          $v = (Get-Item payload\core\dlls\mp.dll).VersionInfo
          $regame = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"
          "app=$app" >> $env:GITHUB_OUTPUT
          "regame=$regame" >> $env:GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.app }}" output\CS16_ZBots_Setup.exe
          --title "Counter-Strike 1.6 ZBots v${{ steps.version.outputs.app }}"
          --notes "Includes ReGameDLL_CS ${{ steps.version.outputs.regame }}. Run CS16_ZBots_Setup.exe and see the README for details."
